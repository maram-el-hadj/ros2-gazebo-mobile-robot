slam_toolbox:
  ros__parameters:
    # Frames : doivent correspondre a l'arbre TF de l'etape 5
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # Horloge de simulation (/clock)
    use_sim_time: true

    # Carte
    resolution: 0.05
    max_laser_range: 6.0
    map_update_interval: 2.0

    # Quand traiter un nouveau scan
    minimum_time_interval: 0.5
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    throttle_scans: 1

    # Correction de la derive
    do_loop_closing: true

    # TF
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    transform_publish_period: 0.02

    debug_logging: false
    stack_size_to_use: 40000000
